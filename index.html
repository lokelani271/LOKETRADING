<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Semi-Skimmed Milk — Pure Light Essential</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --blue-neon: #4fc3f7;
      --blue-deep: #0d47a1;
      --white-pure: #f0f8ff;
      --bg-dark: #0a0a1a;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg-dark);
      color: var(--white-pure);
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      overflow-x: hidden;
    }

    /* ── Canvas ── */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    canvas {
      display: block;
    }

    /* ── Scroll wrapper ── */
    #scroll-wrapper {
      position: relative;
      z-index: 10;
    }

    /* ── Sections ── */
    section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 4rem 2rem;
    }

    .section-content {
      text-align: center;
      max-width: 700px;
      opacity: 0;
      transform: translateY(60px);
      transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .section-content.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Section 1 */
    #section-1 {
      min-height: 100vh;
    }

    #section-1 .section-content {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      width: 90%;
    }

    #section-1 .section-content.visible {
      transform: translateX(-50%) translateY(0);
    }

    .tagline {
      font-size: clamp(2.8rem, 8vw, 6rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
      background: linear-gradient(135deg, #ffffff 0%, #4fc3f7 50%, #ffffff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s linear infinite;
    }

    @keyframes shimmer {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    .dot-separator {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--blue-neon);
      border-radius: 50%;
      margin: 0 0.5rem;
      vertical-align: middle;
      box-shadow: 0 0 8px var(--blue-neon);
    }

    .subtitle {
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--blue-neon);
      margin-top: 1.2rem;
      font-weight: 300;
    }

    /* Section 2 */
    #section-2 {
      min-height: 100vh;
    }

    #section-2 .section-content {
      position: absolute;
      right: 5%;
      top: 50%;
      transform: translateY(-50%) translateX(60px);
      text-align: right;
      max-width: 420px;
    }

    #section-2 .section-content.visible {
      transform: translateY(-50%) translateX(0);
    }

    @media (max-width: 768px) {
      #section-2 .section-content {
        right: auto;
        left: 50%;
        top: auto;
        bottom: 10%;
        transform: translateX(-50%) translateY(60px);
        text-align: center;
        max-width: 90%;
      }
      #section-2 .section-content.visible {
        transform: translateX(-50%) translateY(0);
      }
    }

    .stat-line {
      font-size: clamp(2rem, 6vw, 4.5rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .stat-highlight {
      color: var(--blue-neon);
      text-shadow: 0 0 20px rgba(79, 195, 247, 0.6);
    }

    .stat-sub {
      font-size: clamp(0.85rem, 1.8vw, 1rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-top: 1rem;
      font-weight: 300;
    }

    .divider-line {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, var(--blue-neon), transparent);
      margin: 1.2rem 0 1.2rem auto;
      box-shadow: 0 0 8px var(--blue-neon);
    }

    @media (max-width: 768px) {
      .divider-line {
        margin: 1.2rem auto;
      }
    }

    /* Section 3 */
    #section-3 {
      min-height: 100vh;
    }

    #section-3 .headline {
      font-size: clamp(1.8rem, 5vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 0.5rem;
    }

    #section-3 .headline-sub {
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 3rem;
    }

    .cta-btn {
      display: inline-block;
      padding: 1.1rem 3rem;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--bg-dark);
      background: linear-gradient(135deg, #4fc3f7, #81d4fa);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
      box-shadow: 0 0 30px rgba(79, 195, 247, 0.4), 0 0 60px rgba(79, 195, 247, 0.2);
    }

    .cta-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.5s ease;
    }

    .cta-btn:hover::before {
      transform: translateX(100%);
    }

    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 50px rgba(79, 195, 247, 0.7), 0 0 100px rgba(79, 195, 247, 0.3);
    }

    .cta-btn:active {
      transform: translateY(0);
    }

    .features {
      display: flex;
      gap: 2rem;
      margin-top: 3rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .feature-item {
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .feature-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .feature-item:nth-child(2) { transition-delay: 0.1s; }
    .feature-item:nth-child(3) { transition-delay: 0.2s; }

    .feature-icon {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .feature-label {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }

    /* Scroll indicator */
    .scroll-indicator {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      z-index: 20;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    .scroll-indicator.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .scroll-line {
      width: 1px;
      height: 50px;
      background: linear-gradient(to bottom, var(--blue-neon), transparent);
      animation: scroll-pulse 1.5s ease-in-out infinite;
    }

    @keyframes scroll-pulse {
      0%, 100% { opacity: 0.4; transform: scaleY(1); }
      50% { opacity: 1; transform: scaleY(1.1); }
    }

    .scroll-text {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
    }

    /* Progress bar */
    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--blue-deep), var(--blue-neon));
      z-index: 100;
      width: 0%;
      transition: width 0.1s linear;
      box-shadow: 0 0 8px var(--blue-neon);
    }

    /* Nav dots */
    #nav-dots {
      position: fixed;
      right: 2rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      z-index: 50;
    }

    .nav-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1px solid rgba(79, 195, 247, 0.4);
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .nav-dot.active {
      background: var(--blue-neon);
      box-shadow: 0 0 10px var(--blue-neon);
      transform: scale(1.3);
    }

    @media (max-width: 600px) {
      #nav-dots { display: none; }
    }

    /* Noise overlay */
    .noise-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 128px;
    }
  </style>
</head>
<body>

  <!-- Noise texture overlay -->
  <div class="noise-overlay"></div>

  <!-- Progress bar -->
  <div id="progress-bar"></div>

  <!-- Navigation dots -->
  <div id="nav-dots">
    <div class="nav-dot active" data-section="0"></div>
    <div class="nav-dot" data-section="1"></div>
    <div class="nav-dot" data-section="2"></div>
  </div>

  <!-- Three.js Canvas -->
  <div id="canvas-container">
    <canvas id="three-canvas"></canvas>
  </div>

  <!-- Scroll content -->
  <div id="scroll-wrapper">

    <!-- Section 1: Hero -->
    <section id="section-1">
      <div class="section-content" id="content-1">
        <div class="tagline">
          Pure<span class="dot-separator"></span>Light<span class="dot-separator"></span>Essential
        </div>
        <div class="subtitle">Semi-skimmed &nbsp;&middot;&nbsp; Naturally balanced</div>
      </div>
    </section>

    <!-- Section 2: Stats -->
    <section id="section-2">
      <div class="section-content" id="content-2">
        <div class="stat-line">
          <span class="stat-highlight">50%</span> less fat.
        </div>
        <div class="divider-line"></div>
        <div class="stat-line">
          <span class="stat-highlight">100%</span> taste.
        </div>
        <div class="stat-sub">The perfect balance, redefined</div>
      </div>
    </section>

    <!-- Section 3: CTA -->
    <section id="section-3">
      <div class="section-content" id="content-3">
        <div class="headline">Crafted for those<br>who expect more.</div>
        <div class="headline-sub">From farm to your table</div>
        <a href="#" class="cta-btn">Discover our milk</a>
        <div class="features">
          <div class="feature-item" id="feat-1">
            <div class="feature-icon">&#9679;</div>
            <div class="feature-label">Naturally<br>sourced</div>
          </div>
          <div class="feature-item" id="feat-2">
            <div class="feature-icon">&#9675;</div>
            <div class="feature-label">Rich in<br>calcium</div>
          </div>
          <div class="feature-item" id="feat-3">
            <div class="feature-icon">&#10022;</div>
            <div class="feature-label">Cold<br>pressed</div>
          </div>
        </div>
      </div>
    </section>

  </div>

  <!-- Scroll indicator -->
  <div class="scroll-indicator" id="scroll-indicator">
    <span class="scroll-text">Scroll</span>
    <div class="scroll-line"></div>
  </div>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
  (function () {
    'use strict';

    // ─── Scene Setup ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('three-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0a1a, 0.04);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.5, 5);

    // ─── Resize ───────────────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    // ─── Lighting ─────────────────────────────────────────────────────────────
    const ambientLight = new THREE.AmbientLight(0x0a1a3a, 0.8);
    scene.add(ambientLight);

    // Main key light — cool blue
    const keyLight = new THREE.PointLight(0x4fc3f7, 3, 12);
    keyLight.position.set(3, 3, 3);
    keyLight.castShadow = true;
    scene.add(keyLight);

    // Fill light — soft blue
    const fillLight = new THREE.PointLight(0x81d4fa, 1.5, 10);
    fillLight.position.set(-3, 1, 2);
    scene.add(fillLight);

    // Rim light — deep blue accent
    const rimLight = new THREE.PointLight(0x1565c0, 2, 8);
    rimLight.position.set(0, -2, -3);
    scene.add(rimLight);

    // Top glow
    const topLight = new THREE.PointLight(0xffffff, 1, 6);
    topLight.position.set(0, 4, 0);
    scene.add(topLight);

    // ─── Milk Carton ──────────────────────────────────────────────────────────
    const cartonGroup = new THREE.Group();
    scene.add(cartonGroup);

    // Body
    const bodyGeo = new THREE.BoxGeometry(1, 1.6, 1, 4, 4, 4);
    const bodyMat = new THREE.MeshPhysicalMaterial({
      color: 0xedf6ff,
      roughness: 0.08,
      metalness: 0.0,
      transmission: 0.15,
      thickness: 0.8,
      reflectivity: 0.9,
      clearcoat: 1,
      clearcoatRoughness: 0.05,
      envMapIntensity: 1.2,
    });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.castShadow = true;
    body.receiveShadow = true;
    cartonGroup.add(body);

    // Roof (gable top) — two slanted triangular prism panels
    const roofMat = new THREE.MeshPhysicalMaterial({
      color: 0xd0eeff,
      roughness: 0.1,
      metalness: 0.0,
      clearcoat: 0.8,
    });

    // Roof panel front
    const roofFrontShape = new THREE.Shape();
    roofFrontShape.moveTo(-0.5, 0);
    roofFrontShape.lineTo(0.5, 0);
    roofFrontShape.lineTo(0, 0.45);
    roofFrontShape.closePath();
    const roofExtSettings = { depth: 1, bevelEnabled: false };
    const roofFrontGeo = new THREE.ExtrudeGeometry(roofFrontShape, roofExtSettings);
    const roofFront = new THREE.Mesh(roofFrontGeo, roofMat);
    roofFront.position.set(-0.5, 0.8, -0.5);
    roofFront.castShadow = true;
    cartonGroup.add(roofFront);

    // Small cap on top ridge
    const ridgeGeo = new THREE.BoxGeometry(0.08, 0.5, 1.02);
    const ridgeMat = new THREE.MeshPhysicalMaterial({
      color: 0xb0d8f0,
      roughness: 0.05,
      clearcoat: 1,
    });
    const ridge = new THREE.Mesh(ridgeGeo, ridgeMat);
    ridge.position.set(0, 1.25, 0);
    cartonGroup.add(ridge);

    // Blue stripe decorative band
    const stripeMat = new THREE.MeshPhysicalMaterial({
      color: 0x1e88e5,
      roughness: 0.2,
      metalness: 0.1,
      emissive: 0x0d47a1,
      emissiveIntensity: 0.3,
    });
    const stripeGeo = new THREE.BoxGeometry(1.002, 0.12, 1.002);
    const stripe = new THREE.Mesh(stripeGeo, stripeMat);
    stripe.position.set(0, 0.2, 0);
    cartonGroup.add(stripe);

    const stripe2Geo = new THREE.BoxGeometry(1.002, 0.05, 1.002);
    const stripe2 = new THREE.Mesh(stripe2Geo, stripeMat);
    stripe2.position.set(0, -0.5, 0);
    cartonGroup.add(stripe2);

    // Inner liquid visible (slightly blue tint)
    const liquidGeo = new THREE.BoxGeometry(0.88, 1.3, 0.88);
    const liquidMat = new THREE.MeshPhysicalMaterial({
      color: 0xd6effe,
      transmission: 0.9,
      roughness: 0.0,
      metalness: 0.0,
      thickness: 1.2,
      ior: 1.33,
      transparent: true,
      opacity: 0.4,
    });
    const liquid = new THREE.Mesh(liquidGeo, liquidMat);
    liquid.position.set(0, -0.1, 0);
    cartonGroup.add(liquid);

    cartonGroup.position.set(0, 0, 0);

    // ─── Star Field ───────────────────────────────────────────────────────────
    const starCount = 1200;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      starPositions[i * 3]     = (Math.random() - 0.5) * 80;
      starPositions[i * 3 + 1] = (Math.random() - 0.5) * 80;
      starPositions[i * 3 + 2] = (Math.random() - 0.5) * 80;
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMat = new THREE.PointsMaterial({
      color: 0xaaccff,
      size: 0.06,
      transparent: true,
      opacity: 0.6,
      sizeAttenuation: true,
    });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // ─── Milk Particles ───────────────────────────────────────────────────────
    const PARTICLE_COUNT = 320;
    const particlePositions = new Float32Array(PARTICLE_COUNT * 3);
    const particleSeeds     = new Float32Array(PARTICLE_COUNT * 3); // phase offsets

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const theta  = Math.random() * Math.PI * 2;
      const phi    = Math.random() * Math.PI;
      const radius = 1.2 + Math.random() * 2.0;
      particlePositions[i * 3]     = radius * Math.sin(phi) * Math.cos(theta);
      particlePositions[i * 3 + 1] = radius * Math.cos(phi);
      particlePositions[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
      particleSeeds[i * 3]     = Math.random() * Math.PI * 2;
      particleSeeds[i * 3 + 1] = Math.random() * Math.PI * 2;
      particleSeeds[i * 3 + 2] = 0.3 + Math.random() * 0.7;
    }

    const particleGeo = new THREE.BufferGeometry();
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

    const particleMat = new THREE.PointsMaterial({
      color: 0xd0f0ff,
      size: 0.05,
      transparent: true,
      opacity: 0.85,
      sizeAttenuation: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });

    const particles = new THREE.Points(particleGeo, particleMat);
    cartonGroup.add(particles);

    // Original radii for orbiting
    const particleRadii  = new Float32Array(PARTICLE_COUNT);
    const particleThetas = new Float32Array(PARTICLE_COUNT);
    const particlePhis   = new Float32Array(PARTICLE_COUNT);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const x = particlePositions[i * 3];
      const y = particlePositions[i * 3 + 1];
      const z = particlePositions[i * 3 + 2];
      particleRadii[i]  = Math.sqrt(x*x + y*y + z*z);
      particleThetas[i] = Math.atan2(z, x);
      particlePhis[i]   = Math.acos(y / particleRadii[i]);
    }

    // ─── Glow plane behind carton ─────────────────────────────────────────────
    const glowGeo = new THREE.PlaneGeometry(4, 5);
    const glowMat = new THREE.MeshBasicMaterial({
      color: 0x1a5090,
      transparent: true,
      opacity: 0.04,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide,
    });
    const glowPlane = new THREE.Mesh(glowGeo, glowMat);
    glowPlane.position.set(0, 0, -1.5);
    scene.add(glowPlane);

    // ─── Ground Reflection ────────────────────────────────────────────────────
    const groundGeo = new THREE.PlaneGeometry(12, 12);
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x050510,
      roughness: 0.2,
      metalness: 0.8,
      transparent: true,
      opacity: 0.7,
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -1.2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ─── Scroll State ─────────────────────────────────────────────────────────
    let scrollY    = 0;
    let scrollPct  = 0;
    let targetCamX = 0;
    let targetCamY = 0.5;
    let targetCamZ = 5;

    // Camera animation targets per section
    const camStates = [
      { x: 0,    y: 0.5, z: 5,   rotY: 0 },
      { x: -1.5, y: 0.2, z: 4.2, rotY: 0.4 },
      { x: 0,    y: 0,   z: 4.8, rotY: 0 },
    ];

    let currentSection = 0;

    // ─── Section Observer ─────────────────────────────────────────────────────
    const sectionEls = [
      document.getElementById('section-1'),
      document.getElementById('section-2'),
      document.getElementById('section-3'),
    ];
    const contentEls = [
      document.getElementById('content-1'),
      document.getElementById('content-2'),
      document.getElementById('content-3'),
    ];
    const featEls = [
      document.getElementById('feat-1'),
      document.getElementById('feat-2'),
      document.getElementById('feat-3'),
    ];
    const navDots = document.querySelectorAll('.nav-dot');

    // Trigger section 1 immediately
    setTimeout(() => contentEls[0].classList.add('visible'), 400);

    const obsOpts = { threshold: 0.35 };
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const idx = sectionEls.indexOf(entry.target);
          if (idx !== -1) {
            currentSection = idx;
            contentEls[idx].classList.add('visible');
            if (idx === 2) {
              featEls.forEach(f => f.classList.add('visible'));
            }
            navDots.forEach((d, i) => d.classList.toggle('active', i === idx));
          }
        }
      });
    }, obsOpts);

    sectionEls.forEach(s => observer.observe(s));

    // Nav dot click
    navDots.forEach(dot => {
      dot.addEventListener('click', () => {
        const idx = parseInt(dot.dataset.section);
        sectionEls[idx].scrollIntoView({ behavior: 'smooth' });
      });
    });

    // ─── Scroll Events ────────────────────────────────────────────────────────
    const scrollIndicator = document.getElementById('scroll-indicator');
    const progressBar     = document.getElementById('progress-bar');

    window.addEventListener('scroll', () => {
      scrollY   = window.scrollY;
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      scrollPct = scrollY / maxScroll;

      progressBar.style.width = (scrollPct * 100) + '%';
      scrollIndicator.classList.toggle('hidden', scrollY > 80);
    }, { passive: true });

    // ─── Mouse Parallax ───────────────────────────────────────────────────────
    let mouseX = 0, mouseY = 0;
    let targetMouseX = 0, targetMouseY = 0;

    window.addEventListener('mousemove', e => {
      mouseX = (e.clientX / window.innerWidth  - 0.5) * 2;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    // Touch support
    window.addEventListener('touchmove', e => {
      if (e.touches.length > 0) {
        mouseX = (e.touches[0].clientX / window.innerWidth  - 0.5) * 2;
        mouseY = (e.touches[0].clientY / window.innerHeight - 0.5) * 2;
      }
    }, { passive: true });

    // ─── Lerp helper ──────────────────────────────────────────────────────────
    function lerp(a, b, t) { return a + (b - a) * t; }

    // ─── Animation Loop ───────────────────────────────────────────────────────
    let clock = new THREE.Clock();
    let prevCamX = 0, prevCamY = 0.5, prevCamZ = 5;

    function animate() {
      requestAnimationFrame(animate);
      const t     = clock.getElapsedTime();
      const delta = clock.getDelta ? 0.016 : 0.016;

      // Smooth mouse
      targetMouseX = lerp(targetMouseX, mouseX, 0.05);
      targetMouseY = lerp(targetMouseY, mouseY, 0.05);

      // ── Camera interpolation ──
      const state = camStates[currentSection];
      prevCamX = lerp(prevCamX, state.x + targetMouseX * 0.3, 0.04);
      prevCamY = lerp(prevCamY, state.y - targetMouseY * 0.2, 0.04);
      prevCamZ = lerp(prevCamZ, state.z, 0.04);
      camera.position.set(prevCamX, prevCamY, prevCamZ);
      camera.lookAt(0, 0, 0);

      // ── Carton rotation ──
      if (currentSection === 0) {
        // Slow majestic spin
        cartonGroup.rotation.y = t * 0.4 + targetMouseX * 0.3;
        cartonGroup.rotation.x = Math.sin(t * 0.3) * 0.06 - targetMouseY * 0.1;
      } else if (currentSection === 1) {
        // Faster spin during stats
        cartonGroup.rotation.y = t * 1.1;
        cartonGroup.rotation.x = Math.sin(t * 0.5) * 0.12;
      } else {
        // Gentle sway in CTA
        cartonGroup.rotation.y = Math.sin(t * 0.5) * 0.5 + targetMouseX * 0.2;
        cartonGroup.rotation.x = Math.sin(t * 0.3) * 0.05 - targetMouseY * 0.05;
      }

      // Subtle Y float
      cartonGroup.position.y = Math.sin(t * 0.7) * 0.08;

      // ── Particle animation ──
      const pos = particles.geometry.attributes.position.array;
      const swirl = currentSection === 1 ? 2.5 : 1.0;

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const phaseA = particleSeeds[i * 3];
        const phaseB = particleSeeds[i * 3 + 1];
        const speed  = particleSeeds[i * 3 + 2];
        const r = particleRadii[i];

        const theta = particleThetas[i] + t * speed * 0.18 * swirl;
        const phi   = particlePhis[i] + Math.sin(t * speed * 0.12 + phaseA) * 0.2;

        pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta) + Math.sin(t * speed + phaseB) * 0.06;
        pos[i * 3 + 1] = r * Math.cos(phi) + Math.sin(t * speed * 0.5 + phaseA) * 0.1;
        pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta) + Math.cos(t * speed + phaseA) * 0.06;
      }
      particles.geometry.attributes.position.needsUpdate = true;

      // ── Particle size pulse ──
      particleMat.size = 0.04 + Math.sin(t * 1.5) * 0.012;
      particleMat.opacity = currentSection === 1
        ? 0.9 + Math.sin(t * 2) * 0.08
        : 0.7 + Math.sin(t) * 0.1;

      // ── Lights orbit ──
      keyLight.position.x = Math.sin(t * 0.4) * 3.5;
      keyLight.position.z = Math.cos(t * 0.4) * 3.5;
      keyLight.intensity  = 2.5 + Math.sin(t * 1.2) * 0.5;

      fillLight.position.x = Math.sin(t * 0.3 + Math.PI) * 2.5;
      fillLight.position.z = Math.cos(t * 0.3 + Math.PI) * 2.5;

      rimLight.intensity = 1.5 + Math.sin(t * 0.8) * 0.5;

      // ── Star rotation ──
      stars.rotation.y = t * 0.01;
      stars.rotation.x = t * 0.003;

      // ── Glow pulse ──
      glowMat.opacity = 0.03 + Math.sin(t * 0.6) * 0.015;

      renderer.render(scene, camera);
    }

    animate();

  })();
  </script>
</body>
